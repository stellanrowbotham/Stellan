<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../../engine/lib.js"></script>
<script>
// ep11 · Pet groomer · Waitlist + cancellation-fill bot · F11 town map / radar · local pride (SW Ontario) · air-traffic control
WHO.tower = ['CONTROL TOWER', C.mint];
const SALON = { x: 540, y: 800 };
const PINS = [{ n: 'Max', x: 230, y: 520 }, { n: 'Luna', x: 850, y: 540 }, { n: 'Biscuit', x: 290, y: 1140 }, { n: 'Daisy', x: 850, y: 880 }];
const PICK = 2;
const ROUTE = [[290, 1140], [290, 960], [540, 960], [540, 800]];
const STREETS_H = [380, 560, 760, 960, 1160, 1300], STREETS_V = [150, 290, 540, 700, 930];

function routePt(k) { // k in 0..1 along ROUTE
  const L = []; let tot = 0; for (let i = 1; i < ROUTE.length; i++) { const d = Math.hypot(ROUTE[i][0] - ROUTE[i - 1][0], ROUTE[i][1] - ROUTE[i - 1][1]); L.push(d); tot += d; }
  let r = k * tot; for (let i = 1; i < ROUTE.length; i++) { if (r <= L[i - 1]) { const f = r / L[i - 1]; return { x: lerp(ROUTE[i - 1][0], ROUTE[i][0], f), y: lerp(ROUTE[i - 1][1], ROUTE[i][1], f) }; } r -= L[i - 1]; }
  return { x: ROUTE[ROUTE.length - 1][0], y: ROUTE[ROUTE.length - 1][1] };
}

function map(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#04140F'); g.addColorStop(1, '#020A08'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // blocks + streets
  ctx.fillStyle = 'rgba(61,255,168,.035)'; for (let i = 0; i < STREETS_H.length - 1; i++) for (let j = 0; j < STREETS_V.length - 1; j++) { rr(STREETS_V[j] + 22, STREETS_H[i] + 22, STREETS_V[j + 1] - STREETS_V[j] - 44, STREETS_H[i + 1] - STREETS_H[i] - 44, 14); ctx.fill(); }
  ctx.strokeStyle = 'rgba(61,255,168,.18)'; ctx.lineWidth = 6;
  STREETS_H.forEach(y => { ctx.beginPath(); ctx.moveTo(60, y); ctx.lineTo(W - 60, y); ctx.stroke(); });
  STREETS_V.forEach(x => { ctx.beginPath(); ctx.moveTo(x, 330); ctx.lineTo(x, 1340); ctx.stroke(); });
  // river curve for flavour
  ctx.strokeStyle = 'rgba(80,160,255,.22)'; ctx.lineWidth = 26; ctx.beginPath(); ctx.moveTo(1000, 330); ctx.bezierCurveTo(960, 700, 1060, 900, 1000, 1340); ctx.stroke();
  // radar rings + sweep around salon
  ctx.strokeStyle = 'rgba(61,255,168,.15)'; ctx.lineWidth = 2; for (let r = 150; r <= 600; r += 150) { ctx.beginPath(); ctx.arc(SALON.x, SALON.y, r, 0, 7); ctx.stroke(); }
  const a = t * 1.6; ctx.save(); ctx.beginPath(); ctx.moveTo(SALON.x, SALON.y); ctx.arc(SALON.x, SALON.y, 640, a - .5, a); ctx.closePath();
  const sg = ctx.createRadialGradient(SALON.x, SALON.y, 0, SALON.x, SALON.y, 640); sg.addColorStop(0, 'rgba(61,255,168,.25)'); sg.addColorStop(1, 'rgba(61,255,168,0)'); ctx.fillStyle = sg; ctx.fill(); ctx.restore();
}

function header(t) {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `900 64px ${FONT}`; ctx.fillStyle = '#fff'; ctx.shadowColor = C.mint; ctx.shadowBlur = 20; ctx.fillText('WAITLIST CONTROL TOWER', W / 2, 170); ctx.shadowBlur = 0;
  ctx.font = `700 32px ${FONT}`; ctx.fillStyle = C.mint; ctx.fillText('DOG GROOMER · SOUTHWESTERN ONTARIO', W / 2, 240);
}

function paw(x, y, s, col) {
  ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x, y + s * .18, s * .32, s * .26, 0, 0, 7); ctx.fill();
  [[-.34, -.12], [-.12, -.32], [.12, -.32], [.34, -.12]].forEach(([dx, dy]) => { ctx.beginPath(); ctx.arc(x + dx * s, y + dy * s, s * .12, 0, 7); ctx.fill(); });
}

function salon(t) {
  const alarm = t > TL.cancel && t < TL.filled ? (Math.floor(t * 4) % 2 ? 1 : .4) : 0;
  const col = t >= TL.filled ? C.mint : alarm ? C.red : C.cyan;
  ctx.save(); ctx.translate(SALON.x, SALON.y);
  if (alarm) { ctx.beginPath(); ctx.arc(0, 0, 90 + 30 * ((t * 2) % 1), 0, 7); ctx.strokeStyle = `rgba(255,77,109,${alarm * (1 - (t * 2) % 1)})`; ctx.lineWidth = 6; ctx.stroke(); }
  ctx.beginPath(); ctx.arc(0, 0, 70, 0, 7); ctx.fillStyle = '#0B1A2E'; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 30; ctx.stroke(); ctx.shadowBlur = 0;
  // scissors
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(-24, -26); ctx.lineTo(22, 18); ctx.moveTo(24, -26); ctx.lineTo(-22, 18); ctx.stroke();
  ctx.beginPath(); ctx.arc(-26, 26, 11, 0, 7); ctx.arc(26, 26, 11, 0, 7); ctx.stroke();
  ctx.font = `800 26px ${FONT}`; ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.fillText('THE SALON', 0, 108);
  ctx.restore();
}

function pins(t) {
  PINS.forEach((p, i) => {
    const k = eBack(seg(t, TL.pins[i], TL.pins[i] + .3)); if (k <= 0) return;
    const picked = i === PICK && t > TL.pick, dim = i !== PICK && t > TL.pick;
    ctx.save(); ctx.globalAlpha = dim ? .35 : 1; ctx.translate(p.x, p.y); ctx.scale(k, k);
    if (picked) { for (let r = 0; r < 2; r++) { const ph = ((t - TL.pick) * 1.2 + r * .5) % 1; ctx.beginPath(); ctx.arc(0, 0, 60 + ph * 70, 0, 7); ctx.strokeStyle = `rgba(255,181,71,${1 - ph})`; ctx.lineWidth = 5; ctx.stroke(); } }
    ctx.beginPath(); ctx.arc(0, 0, 50, 0, 7); ctx.fillStyle = picked ? C.amber : '#123A2C'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = picked ? '#fff' : C.mint; ctx.stroke();
    paw(0, 0, 60, picked ? '#3A2300' : C.mint);
    ctx.font = `800 30px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff'; ctx.fillText(p.n, 0, 84);
    ctx.font = `700 20px ${FONT}`; ctx.fillStyle = C.grey; ctx.fillText('WAITLIST #' + (i + 1), 0, 114);
    ctx.restore();
  });
  // scan label
  if (t > TL.scan && t < TL.pick + .6) { ctx.save(); ctx.globalAlpha = Math.floor(t * 4) % 2 ? 1 : .5; ctx.font = `800 34px ${MONO()}`; ctx.fillStyle = C.mint; ctx.textAlign = 'center'; ctx.fillText('SCANNING WAITLIST...', W / 2, 330); ctx.restore(); }
}
function MONO() { return '"DejaVu Sans Mono", ui-monospace, monospace'; }

function route(t) {
  const k = eIO(seg(t, TL.cleared, TL.cleared + 1.2)); if (k <= 0) return;
  ctx.save(); ctx.setLineDash([22, 16]); ctx.lineDashOffset = -t * 60; ctx.strokeStyle = C.amber; ctx.lineWidth = 10; ctx.lineCap = 'round'; ctx.shadowColor = C.amber; ctx.shadowBlur = 20;
  ctx.beginPath(); ctx.moveTo(ROUTE[0][0], ROUTE[0][1]); for (let s = 1; s <= 40; s++) { const p = routePt(k * s / 40); ctx.lineTo(p.x, p.y); } ctx.stroke(); ctx.restore();
  if (t > TL.cleared + .3) { const ck = eBack(seg(t, TL.cleared + .3, TL.cleared + .6)); ctx.save(); ctx.translate(W / 2, 330); ctx.scale(ck, ck); rr(-300, -42, 600, 84, 42); ctx.fillStyle = C.amber; ctx.fill(); ctx.font = `900 40px ${FONT}`; ctx.fillStyle = '#2A1800'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('BISCUIT: CLEARED 2:00', 0, 3); ctx.restore(); }
  // dog marker drives in
  const dk = eIO(seg(t, TL.drive[0], TL.drive[1]));
  if (t > TL.drive[0] - .1 && t < TL.logo) { const p = routePt(dk); ctx.save(); ctx.translate(p.x, p.y + Math.sin(t * 14) * 4); ctx.beginPath(); ctx.arc(0, 0, 36, 0, 7); ctx.fillStyle = '#fff'; ctx.fill(); paw(0, 0, 44, C.amber); ctx.restore(); }
}

function bubbles(t) {
  const tk = seg(t, TL.text, TL.text + .3);
  if (tk > 0) { ctx.save(); ctx.font = `600 32px ${FONT}`; ctx.translate(500, 1060); ctx.scale(eBack(tk), eBack(tk)); rr(0, 0, 520, 150, 28); ctx.fillStyle = '#2F80ED'; ctx.fill(); ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ['A 2:00 PM spot just opened', 'for Biscuit. Want it?', 'Reply YES'].forEach((l, i) => ctx.fillText(l, 28, 36 + i * 40)); ctx.restore(); }
  const rk = seg(t, TL.reply, TL.reply + .3);
  if (rk > 0) { ctx.save(); ctx.font = `800 34px ${FONT}`; ctx.translate(560, 1230); ctx.scale(eBack(rk), eBack(rk)); rr(0, 0, 400, 80, 28); ctx.fillStyle = '#3A3F55'; ctx.fill(); ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText('YES! On our way!', 28, 42); ctx.restore(); }
}

function slotCard(t) {
  let st = ['BOOKED', C.grey], sub = 'Table 1 · full groom';
  if (t > TL.cancel) st = ['CANCELLED', C.red], sub = 'Client cancelled';
  if (t > TL.open) st = ['OPEN', C.amber], sub = 'Waitlist being contacted';
  if (t > TL.filled) st = ['FILLED · 2:01', C.mint], sub = 'Biscuit is booked in';
  const pop = t > TL.cancel && t < TL.cancel + .3 ? 1 + .08 * Math.sin(seg(t, TL.cancel, TL.cancel + .3) * Math.PI) : t > TL.filled && t < TL.filled + .3 ? 1 + .08 * Math.sin(seg(t, TL.filled, TL.filled + .3) * Math.PI) : 1;
  ctx.save(); ctx.translate(W / 2, 1450); ctx.scale(pop, pop);
  rr(-460, -80, 920, 160, 30); ctx.fillStyle = 'rgba(8,20,30,.95)'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = st[1]; ctx.stroke();
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left'; ctx.font = `900 60px ${FONT}`; ctx.fillStyle = '#fff'; ctx.fillText('2:00 PM', -420, -18);
  ctx.font = `600 28px ${FONT}`; ctx.fillStyle = C.grey; ctx.fillText(sub, -420, 40);
  ctx.textAlign = 'right'; ctx.font = `900 44px ${FONT}`; ctx.fillStyle = st[1]; ctx.shadowColor = st[1]; ctx.shadowBlur = 18; ctx.fillText(st[0], 420, 2); ctx.shadowBlur = 0;
  ctx.restore();
}

function render(t) {
  let flash = 0;
  if (t < TL.logo) {
    map(t); header(t); route(t); salon(t); pins(t); bubbles(t); slotCard(t);
    confetti(t, TL.filled, SALON.x, SALON.y, 60, 11);
    if (t > TL.cancel && t < TL.cancel + .3) flash = .12;
    if (t > TL.logo - .35) { ctx.fillStyle = `rgba(0,0,0,${seg(t, TL.logo - .35, TL.logo)})`; ctx.fillRect(0, 0, W, H); }
  } else {
    logoEnding(t, TL.logo, { cy: 600, cta: 'Comment “MAP” to see how  →', footer: 'Built in Southwestern Ontario. You stay in control.' });
    flash = .6 * (1 - seg(t, TL.logo, TL.logo + .4));
  }
  captions(t, { y: t => t < TL.logo ? 1720 : 1580 });
  post(t, flash, .3);
}
FP.init(render);
</script></body></html>
