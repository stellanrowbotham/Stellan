<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../../engine/lib.js"></script>
<script>
// ep20 · Roofer · Storm-season lead capture bot · F4 race · weather-forecast parody · seasonal · comment "ROOF"
WHO.anchor = ['STORM WATCH', '#FFD34E'];
const RAIN = (() => { const r = mulberry(12); return Array.from({ length: 90 }, () => ({ x: r() * W, p: r(), l: 20 + r() * 30 })); })();

function studio(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0B2140'); g.addColorStop(1, '#061226'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // header bar
  ctx.fillStyle = '#C8102E'; ctx.fillRect(0, 110, W, 90); ctx.font = `900 50px ${FONT}`; ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText('LIVE  ·  STORM WATCH', 50, 157);
  ctx.beginPath(); ctx.arc(W - 70, 157, 14, 0, 7); ctx.fillStyle = Math.floor(t * 2) % 2 ? '#fff' : '#ff9a9a'; ctx.fill();
  // ticker
  ctx.fillStyle = '#FFD34E'; ctx.fillRect(0, 1530, W, 64); ctx.font = `800 32px ${FONT}`; ctx.fillStyle = '#0B1A30';
  const tick = 'STORM SEASON  ·  ROOF LEAK INQUIRIES RISING  ·  FIRST REPLY OFTEN WINS  ·  '; const tw = ctx.measureText(tick).width; const off = -(t * 160) % tw; for (let k = 0; k < 3; k++) ctx.fillText(tick, off + k * tw, 1563);
}

function radar(t) {
  const k = 1 - seg(t, TL.race - .4, TL.race); if (k <= 0) return;
  ctx.save(); ctx.globalAlpha = k;
  rr(60, 250, 960, 1230, 30); ctx.fillStyle = '#12355E'; ctx.fill();
  ctx.save(); rr(60, 250, 960, 1230, 30); ctx.clip();
  // land shapes
  ctx.fillStyle = '#2E5A3A'; ctx.beginPath(); ctx.moveTo(60, 700); ctx.bezierCurveTo(300, 600, 500, 820, 1020, 650); ctx.lineTo(1020, 1480); ctx.lineTo(60, 1480); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 3; ctx.setLineDash([10, 10]); ctx.beginPath(); ctx.moveTo(60, 1100); ctx.lineTo(1020, 1000); ctx.stroke(); ctx.setLineDash([]);
  // storm blobs moving in
  const sx = lerp(-200, 600, seg(t, 0, 7));
  [[0, 0, 300, 'rgba(61,255,168,.45)'], [20, 10, 210, 'rgba(255,211,78,.55)'], [40, 20, 120, 'rgba(255,77,109,.65)']].forEach(([dx, dy, r, c]) => { ctx.fillStyle = c; ctx.beginPath(); for (let i = 0; i <= 30; i++) { const a = i / 30 * Math.PI * 2, rr2 = r * (1 + .12 * Math.sin(a * 5 + t * 2)); ctx.lineTo(sx + dx + Math.cos(a) * rr2, 900 + dy + Math.sin(a) * rr2 * .8); } ctx.fill(); });
  // lead "raindrops" = envelopes
  for (let i = 0; i < 9; i++) { const p = ((t * .6 + i / 9) % 1); const x = sx + 260 + i * 40, y = 650 + p * 700; ctx.save(); ctx.globalAlpha = 1 - p; icon('mail', x, y, 40, '#fff'); ctx.restore(); }
  ctx.restore();
  // speed callout
  const ck = eBack(seg(t, 3.4, 3.8)); if (ck > 0) { ctx.save(); ctx.translate(700, 420); ctx.scale(ck, ck); rr(-250, -60, 500, 120, 20); ctx.fillStyle = 'rgba(6,18,38,.9)'; ctx.fill(); ctx.strokeStyle = '#FFD34E'; ctx.lineWidth = 4; ctx.stroke(); ctx.font = `900 46px ${FONT}`; ctx.fillStyle = '#FFD34E'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('LEADS: 90 km/h', 0, 3); ctx.restore(); }
  ctx.restore();
  RAIN.forEach(d => { const y = ((d.p * H + t * 1400) % H); ctx.strokeStyle = 'rgba(170,200,255,.35)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(d.x, y); ctx.lineTo(d.x - 6, y + d.l); ctx.stroke(); });
}

function race(t) {
  const k = eOut(seg(t, TL.race, TL.race + .5)); if (k <= 0) return;
  ctx.save(); ctx.globalAlpha = k;
  ctx.font = `900 58px ${FONT}`; ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('THE REPLY RACE', W / 2, 290);
  // inquiry card
  const ik = eBack(seg(t, TL.inquiry, TL.inquiry + .3)); if (ik > 0) { ctx.save(); ctx.translate(W / 2, 420); ctx.scale(ik, ik); rr(-400, -60, 800, 120, 30); ctx.fillStyle = '#fff'; ctx.fill(); icon('mail', -340, 0, 50, '#0B2140'); ctx.font = `700 34px ${FONT}`; ctx.fillStyle = '#0B2140'; ctx.textAlign = 'left'; ctx.fillText('"Water coming through the ceiling!"', -290, 2); ctx.restore(); }
  const lanes = [['ROOFER A', 'on a ladder', '#9AA3B5', 'A'], ['ROOFER B', '+ a bot', C.cyan, 'B']];
  lanes.forEach(([n, sub, col, id], i) => {
    const y = 680 + i * 340;
    rr(60, y - 120, 960, 260, 30); ctx.fillStyle = 'rgba(255,255,255,.05)'; ctx.fill(); ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.stroke();
    ctx.font = `900 40px ${FONT}`; ctx.fillStyle = col; ctx.textAlign = 'left'; ctx.fillText(n, 100, y - 70); ctx.font = `600 28px ${FONT}`; ctx.fillStyle = '#B8C2D8'; ctx.fillText(sub, 100 + ctx.measureText(n).width * 1.45 + 20, y - 70);
    // track + finish flag
    ctx.strokeStyle = 'rgba(255,255,255,.2)'; ctx.lineWidth = 6; ctx.setLineDash([20, 14]); ctx.beginPath(); ctx.moveTo(120, y + 80); ctx.lineTo(880, y + 80); ctx.stroke(); ctx.setLineDash([]);
    for (let r = 0; r < 4; r++) for (let c = 0; c < 2; c++) { ctx.fillStyle = (r + c) % 2 ? '#fff' : '#111'; ctx.fillRect(900 + c * 22, y + 36 + r * 22, 22, 22); }
    let p; if (id === 'A') p = seg(t, TL.inquiry, 40) * .9; else p = eIO(seg(t, TL.bstart, TL.bfinish));
    const x = lerp(140, 860, p);
    if (id === 'B') robot(x, y + 70, 100, t, C.cyan);
    else { ctx.save(); ctx.translate(x, y + 70); ctx.scale(.8, .8); ctx.strokeStyle = '#B88A4A'; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(-30, 60); ctx.lineTo(-10, -60); ctx.moveTo(30, 60); ctx.lineTo(10, -60); for (let r = 0; r < 5; r++) { ctx.moveTo(-27 + r * 4, 45 - r * 25); ctx.lineTo(27 - r * 4, 45 - r * 25); } ctx.stroke(); ctx.fillStyle = '#F2C29B'; ctx.beginPath(); ctx.arc(0, -80, 24, 0, 7); ctx.fill(); ctx.restore(); }
    // reply time
    ctx.font = `800 32px ${FONT}`; ctx.textAlign = 'right'; ctx.fillStyle = col;
    if (id === 'A') ctx.fillText(t > TL.booked ? 'still on the ladder' : 'busy...', 1000, y - 70);
    else if (t > TL.reply) ctx.fillText('replied in 1 min ✓', 1000, y - 70);
  });
  // bot reply bubble
  const rk = eBack(seg(t, TL.reply, TL.reply + .3)); if (rk > 0) { ctx.save(); ctx.translate(W / 2, 1300); ctx.scale(rk, rk); rr(-430, -80, 860, 160, 34); ctx.fillStyle = C.cyan; ctx.fill(); ctx.font = `700 33px ${FONT}`; ctx.fillStyle = '#06102A'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('Sorry about the leak! Send a photo?', 0, -24); ctx.fillText('Inspection slot tomorrow at 9 AM.', 0, 26); ctx.restore(); }
  // booked stamp
  const bk = eBack(seg(t, TL.booked, TL.booked + .25)); if (bk > 0) { ctx.save(); ctx.translate(720, 1040); ctx.rotate(-.12); ctx.scale(bk, bk); rr(-190, -55, 380, 110, 18); ctx.fillStyle = C.mint; ctx.fill(); ctx.font = `900 54px ${FONT}`; ctx.fillStyle = '#06102A'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('BOOKED ✓', 0, 4); ctx.restore(); }
  ctx.restore();
  confetti(t, TL.booked, 720, 1040, 60, 8);
}

function forecast(t) {
  const k = eBack(seg(t, TL.forecast, TL.forecast + .4)); if (k <= 0) return;
  ctx.save(); ctx.fillStyle = `rgba(6,18,38,${.75 * seg(t, TL.forecast, TL.forecast + .3)})`; ctx.fillRect(0, 0, W, 1520);
  ctx.translate(W / 2, 800); ctx.scale(k, k); rr(-430, -230, 860, 460, 40); ctx.fillStyle = '#FFF7DA'; ctx.fill();
  ctx.fillStyle = '#FFD34E'; ctx.beginPath(); ctx.arc(-260, -60, 90, 0, 7); ctx.fill(); for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2 + t; ctx.fillRect(-260 + Math.cos(a) * 120 - 8, -60 + Math.sin(a) * 120 - 8, 16, 16); }
  ctx.font = `900 46px ${FONT}`; ctx.fillStyle = '#0B2140'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText("TONIGHT'S", -110, -110); ctx.fillText('FORECAST', -110, -50);
  ctx.font = `800 42px ${FONT}`; ctx.textAlign = 'center'; ctx.fillStyle = '#C8102E'; ctx.fillText('First reply often gets the job', 0, 120);
  ctx.restore();
}

function render(t) {
  let flash = 0;
  if (t < TL.logo) {
    studio(t); radar(t); race(t); forecast(t);
    if ((t > 2.4 && t < 2.5) || (t > 5.8 && t < 5.88)) flash = .35;
    if (t > TL.logo - .35) { ctx.fillStyle = `rgba(0,0,0,${seg(t, TL.logo - .35, TL.logo)})`; ctx.fillRect(0, 0, W, H); }
  } else {
    logoEnding(t, TL.logo, { cy: 600, cta: 'Comment “ROOF” to see how  →', footer: 'Storm-season leads answered. You stay in control.' });
    flash = .6 * (1 - seg(t, TL.logo, TL.logo + .4));
  }
  captions(t, { y: t => t < TL.logo ? 1730 : 1580 });
  post(t, flash, .3);
}
FP.init(render);
</script></body></html>
