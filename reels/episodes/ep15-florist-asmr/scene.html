<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../../engine/lib.js"></script>
<script>
// ep15 · Florist · Holiday order-rush bot · F8 time calculator (labeled example) · seasonal · calm ASMR count
WHO.asmr = ['A CALM COUNT', '#FF9BB8'];
const ROSE = '#E0486E', SAGE = '#5E8B6A', INK = '#3A2430';
const MSGS = ['Do you deliver on Saturday?', 'Is the poinsettia in stock?', 'Can I add a card?', 'What time do you close?', 'Do you have white roses?', 'Same-day delivery?', 'Can I order for the 23rd?', 'How much is a centrepiece?', 'Do you do wreaths?', 'Is parking free?'];
const PETALS = (() => { const r = mulberry(77); return Array.from({ length: 26 }, () => ({ x: r() * W, s: r() * .5 + .3, p: r() * 6.28, z: 14 + r() * 18, c: r() < .5 ? '#F7A9BE' : '#FFD1DC' })); })();

function bg(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#FFF1F3'); g.addColorStop(1, '#FCE3E8'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  PETALS.forEach(p => { const y = ((t * 60 * p.s + p.p * 300) % (H + 100)) - 50, x = p.x + Math.sin(t * .8 + p.p) * 40; ctx.save(); ctx.translate(x, y); ctx.rotate(t * p.s + p.p); ctx.fillStyle = p.c; ctx.beginPath(); ctx.ellipse(0, 0, p.z, p.z * .55, 0, 0, 7); ctx.fill(); ctx.restore(); });
  const b = ctx.createLinearGradient(0, 1520, 0, H); b.addColorStop(0, 'rgba(58,36,48,0)'); b.addColorStop(.25, 'rgba(58,36,48,.92)'); b.addColorStop(1, 'rgba(40,24,32,1)'); ctx.fillStyle = b; ctx.fillRect(0, 1520, W, H - 1520);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = `900 76px ${FONT}`; ctx.fillStyle = ROSE; ctx.fillText('HOLIDAY RUSH', W / 2, 150);
  ctx.font = `600 36px ${FONT}`; ctx.fillStyle = '#A06A7E'; ctx.fillText('at the flower shop · a calm count', W / 2, 215);
}

function msgCount(t) { if (t < T0()) return 0; if (t < TL.count[0]) return 0; if (t < TL.fill[0]) return TL.count.filter(c => t >= c).length; return Math.min(30, 3 + Math.floor(seg(t, TL.fill[0], TL.fill[1]) * 27)); }
function T0() { return 0; }

function inbox(t, dim) {
  const n = msgCount(t);
  ctx.save(); ctx.globalAlpha = 1 - dim * .75;
  rr(120, 290, 840, 1000, 50); ctx.fillStyle = '#fff'; ctx.shadowColor = 'rgba(160,80,110,.25)'; ctx.shadowBlur = 40; ctx.fill(); ctx.shadowBlur = 0;
  ctx.font = `800 38px ${FONT}`; ctx.fillStyle = INK; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText('Shop inbox', 170, 350);
  // count badge
  ctx.save(); ctx.translate(850, 350); const pk = n > 0 ? 1 + .15 * Math.max(0, 1 - ((t * 4) % 1) * 3) * (t < TL.fill[1] ? 1 : 0) : 1; ctx.scale(pk, pk); ctx.beginPath(); ctx.arc(0, 0, 42, 0, 7); ctx.fillStyle = ROSE; ctx.fill(); ctx.font = `900 36px ${FONT}`; ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.fillText(String(n), 0, 2); ctx.restore();
  const shown = Math.min(n, 7), botOn = t > TL.bot;
  for (let i = 0; i < shown; i++) {
    const idx = n - 1 - i, y = 420 + i * 108, txt = MSGS[idx % MSGS.length];
    const ak = botOn ? seg(t, TL.bot + .3 + i * .25, TL.bot + .55 + i * .25) : 0;
    rr(160, y, 760, 88, 30); ctx.fillStyle = ak > 0 ? `rgba(94,139,106,${.12 + .1 * ak})` : '#F6EEF1'; ctx.fill();
    ctx.font = `600 32px ${FONT}`; ctx.fillStyle = INK; ctx.textAlign = 'left'; ctx.fillText(txt, 190, y + 46);
    if (ak > 0) { ctx.save(); ctx.globalAlpha *= ak; icon('check', 880, y + 44, 40, SAGE); ctx.restore(); }
  }
  if (botOn) { const bk = seg(t, TL.bot, TL.bot + .4); ctx.globalAlpha = (1 - dim * .75) * bk; ctx.font = `800 30px ${FONT}`; ctx.fillStyle = SAGE; ctx.textAlign = 'center'; ctx.fillText('✓ answered by your order bot', W / 2, 1250); }
  ctx.restore();
}

function calculator(t) {
  const k = eOut(seg(t, TL.calc, TL.calc + .6)) * (1 - seg(t, TL.bot - .5, TL.bot)); if (k <= 0) return;
  ctx.save(); ctx.globalAlpha = k; ctx.translate(W / 2, 780 + (1 - k) * 40);
  rr(-400, -380, 800, 760, 50); ctx.fillStyle = '#FFFDFB'; ctx.shadowColor = 'rgba(160,80,110,.3)'; ctx.shadowBlur = 50; ctx.fill(); ctx.shadowBlur = 0; ctx.lineWidth = 4; ctx.strokeStyle = '#F2C6D2'; ctx.stroke();
  rr(-130, -340, 260, 60, 30); ctx.fillStyle = '#FFE8A6'; ctx.fill(); ctx.font = `900 30px ${FONT}`; ctx.fillStyle = '#7A5A00'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('EXAMPLE', 0, -308);
  const rows = [['30', 'messages a day'], ['× 3', 'minutes each'], ['= 90', 'minutes'], ['', 'every single day']];
  rows.forEach(([a, b], i) => {
    const rk = eOut(seg(t, TL.rows[i], TL.rows[i] + .5)); if (rk <= 0) return;
    const y = -180 + i * 140; ctx.save(); ctx.globalAlpha = k * rk; ctx.translate((1 - rk) * 40, 0);
    if (i === 2) { const v = Math.round(90 * eOut(seg(t, TL.rows[2], TL.rows[2] + 1.2))); a = '= ' + v; }
    ctx.textAlign = 'right'; ctx.font = `900 ${i === 2 ? 110 : 84}px ${FONT}`; ctx.fillStyle = i === 2 ? ROSE : INK; ctx.fillText(a, -20, y);
    ctx.textAlign = 'left'; ctx.font = `600 40px ${FONT}`; ctx.fillStyle = '#8A5A6E'; ctx.fillText(b, i === 3 ? -200 : 10, y + 6);
    ctx.restore();
  });
  ctx.restore();
}

function breathe(t) {
  const k = seg(t, TL.breathe, TL.breathe + .6); if (k <= 0) return;
  const ph = (t - TL.breathe) / 3.2 * Math.PI * 2, r = 150 + 50 * Math.sin(ph - Math.PI / 2) * .5 + 25;
  ctx.save(); ctx.globalAlpha = k * (1 - seg(t, TL.logo - .4, TL.logo)); ctx.fillStyle = 'rgba(255,241,243,.85)'; ctx.fillRect(0, 280, W, 1240);
  for (let i = 3; i > 0; i--) { ctx.beginPath(); ctx.arc(W / 2, 800, r + i * 40, 0, 7); ctx.fillStyle = `rgba(224,72,110,${.06 * i})`; ctx.fill(); }
  // calm florist face
  ctx.beginPath(); ctx.arc(W / 2, 800, r, 0, 7); ctx.fillStyle = '#F2C29B'; ctx.fill();
  ctx.fillStyle = '#7A3E2A'; ctx.beginPath(); ctx.arc(W / 2, 780, r * 1.02, Math.PI * 1.05, Math.PI * 1.95); ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(W / 2 - r * .35, 800, r * .13, .1 * Math.PI, .9 * Math.PI); ctx.moveTo(W / 2 + r * .48, 800 + r * .02); ctx.arc(W / 2 + r * .35, 800, r * .13, .1 * Math.PI, .9 * Math.PI); ctx.stroke();
  ctx.beginPath(); ctx.arc(W / 2, 830 + r * .1, r * .2, .2 * Math.PI, .8 * Math.PI); ctx.stroke();
  // flower in hair
  for (let i = 0; i < 5; i++) { const a = i / 5 * Math.PI * 2 + t * .3; ctx.fillStyle = ROSE; ctx.beginPath(); ctx.arc(W / 2 + r * .7 + Math.cos(a) * 26, 800 - r * .75 + Math.sin(a) * 26, 20, 0, 7); ctx.fill(); } ctx.fillStyle = '#FFE27A'; ctx.beginPath(); ctx.arc(W / 2 + r * .7, 800 - r * .75, 14, 0, 7); ctx.fill();
  ctx.font = `800 54px ${FONT}`; ctx.fillStyle = SAGE; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(Math.sin(ph) > 0 ? 'breathe in...' : 'and out...', W / 2, 1150);
  ctx.restore();
}

function render(t) {
  let flash = 0;
  if (t < TL.logo) {
    bg(t); inbox(t, seg(t, TL.calc, TL.calc + .6) * (1 - seg(t, TL.bot - .5, TL.bot))); calculator(t); breathe(t);
    if (t > TL.logo - .4) { ctx.fillStyle = `rgba(0,0,0,${seg(t, TL.logo - .4, TL.logo)})`; ctx.fillRect(0, 0, W, H); }
  } else {
    logoEnding(t, TL.logo, { cy: 600, cta: 'Comment “ROSES” for the plan  →', footer: 'Holiday orders answered. You stay in control.' });
    flash = .5 * (1 - seg(t, TL.logo, TL.logo + .4));
  }
  captions(t, { y: t => t < TL.logo ? 1720 : 1580 });
  post(t, flash, .6);
}
FP.init(render);
</script></body></html>
